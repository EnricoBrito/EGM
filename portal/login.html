<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Portal EGM</title>
<link rel="icon" type="image/png" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <p class="login-box__logo">EGM</p>

    <div class="login-tabs" role="tablist">
      <button type="button" class="is-active" data-role="cliente" role="tab" aria-selected="true">cliente</button>
      <button type="button" data-role="ti" role="tab" aria-selected="false">equipe egm</button>
    </div>

    <div class="login-card">
      <p class="console__line console__prompt" id="loginPrompt">&gt; autenticar_cliente()</p>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginEmail">e-mail</label>
          <input type="email" id="loginEmail" required placeholder="contato@suaempresa.com.br">
        </div>
        <div class="field">
          <label for="loginPassword">senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <p class="form-msg" id="loginMsg" role="alert"></p>
        <button type="submit" class="btn btn--primary">Entrar</button>
      </form>
    </div>

    <a href="../index.html#clientes" class="login-back">← Voltar pro site</a>
  </div>
</div>

<script src="js/portal-data.js"></script>
<script src="js/login.js"></script>
</body>
</html>
